<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Computer Network - Ivan Tsian</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="icon" type="image/png" href="/assets/img/logo_withoutTiger.png">
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <style>
    .blog-post-container {
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.06);
    }
    .blog-post-title {
      font-size: 2rem;
      font-weight: 700;
      margin-top: 2rem;
      margin-bottom: 1rem;
      text-align: center;
    }
    .blog-post-date {
      color: #888;
      font-size: 1rem;
      text-align: center;
      margin-bottom: 2rem;
    }
    .blog-post-content {
      font-size: 1.1rem;
      color: #333;
      line-height: 1.8;
      margin-bottom: 2.5rem;
    }
    .blog-image { /* 这里规定了图片显示的方式 */
      width: 100%;
      border-radius: 12px;
      margin: 1.5rem 0;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    pre code {
      display: block;
      padding: 1rem;
      background: #f7f7f7;
      border-radius: 8px;
      font-size: 0.95rem;
      overflow-x: auto;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo">
        <a href="/index.html">
          <img src="/assets/img/logo_withoutTiger.png" alt="Ivan Tsian Logo" style="height:40px; width:40px;">
        </a>
      </div>
      <ul class="nav-links">
        <li><a href="/resume.html">Resume</a></li>
        <li><a href="/blogs/">Blogs</a></li>
      </ul>
    </nav>
  </header>
  <div class="blog-post-container" data-aos="fade-up">
    <h1 class="blog-post-title">Computer Network</h1>
    <div class="blog-post-date">2025年11月23日</div>
    <div class="blog-post-content">
      <p><div class="blog-post-content" id="markdown-content"></div></p> 
      /* 这里将空容器替换为原来的文章，让html自动渲染md文件，这样就只需要在md里面写东西，不需要在这里写一大段了 */
    </div>
  </div>
  <footer>
    <p>&copy; 2024-2026 Ivan/Cheng Qian. All rights reserved.</p>
    <section class="contact" data-aos="fade-up">
      <h2>Get in touch</h2>
      <ul class="contact-links">
        <li><a href="https://github.com/IvanTsian" target="_blank">GitHub</a></li>
        <li><a href="https://www.linkedin.com/in/cheng-ivan-qian/" target="_blank">LinkedIn</a></li>
        <li><a href="mailto:ivantsian@icloud.com">Email</a></li>
      </ul>
    </section>
  </footer>
  <script>
    AOS.init({
      duration: 1000,
      once: true
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    fetch('/blogs/post2.md')
      .then(response => response.text())
      .then(text => {
        document.getElementById('markdown-content').innerHTML = marked.parse(text);
      });
  </script>
</body>
</html>
